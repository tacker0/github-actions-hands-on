name: CI
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - run: echo "Hello, world!"

build:
  runs-on: ubuntu-latest
  permissions:
    contesnts: write
  steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7

    - run: npm install
    - run: npm run build
    - uses: actions/upload-artifact@v7
      with:
        name: 'js-app'
        path: dist
